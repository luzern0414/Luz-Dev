# 运行参数：全部键与默认值（references/config-logging.md §2，OPS-005、CONF-001~003）。
# - 字段说明（类型、范围、能否热加载、是否下发客户端、风险、负责人）在 00-framework/code/luzback/runtime_config.py，改键时两边一起改。
# - 环境文件 dev.toml / staging.toml / prod.toml 只写与本文件不同的值；按门店、渠道、客户端版本、用户百分比的灰度写在环境文件的 [overrides.<名称>]。
# - 这里只放纯数据：不写秘密、地址、端口、进程数、连接池、商户号、密钥路径、回调地址（部署参数在 /etc/luz/api.env），
#   也不写营业时间、起送价、文案（经营内容在后台）。
# - 前半部分是框架分组，后半部分是各业务模块的分组：键名与模块配置属性同名，模块读取时合并进自己的配置对象。
# - 改动走代码评审，提交说明写原因；risk = high 的键（限流、上传上限、维护模式、认证）要第二人评审并先灰度。
# - 检查：python -X utf8 -m luzback.config_check --env all

[logging]
# 根日志级别：debug | info | warning | error；生产 info，排障时临时调低并在结束后还原（可热加载）
level = "info"
# 日志队列容量（条，1000–1000000）；积压到九成后丢 debug/info 并计 luz_log_dropped_total，warning 以上不丢（重启生效）
queue_capacity = 10000

[logging.modules]
# 按 logger 名覆盖级别（logger 名 = 级别），例如 "luz.order" = "debug"；排障结束后删除（可热加载）

[http]
# 请求体上限（KB，1–10240）；超过返回 413；文件走预签名直传，不受此限
max_body_kb = 256

[db]
# 单条 SQL 语句超时（毫秒，100–600000，仅 PostgreSQL）；建立连接时设置（重启生效）
statement_timeout_ms = 5000

[rate_limit]
# 每个 IP 访问 /api/ 的令牌补充速率（次/秒，1–10000）；突发容量为 2 倍
ip_per_s = 20.0
# 每个会员写操作（/api/v1/app/ 的 POST、PUT、PATCH、DELETE）速率（次/秒，0.1–1000，不大于 ip_per_s）；突发 2 倍
user_write_per_s = 3.0
# 登录接口每个 IP 每分钟次数（次/分钟，1–1000；会员登录与后台登录各自计数）
login_per_min = 5
# 后台第二因素校验每个 IP 每分钟次数（次/分钟，1–1000）
admin_mfa_per_min = 10
# 后台敏感操作重新认证每个 IP 每分钟次数（次/分钟，1–1000）
admin_reauth_per_min = 10
# 发送短信验证码接口每个 IP 每分钟次数（次/分钟，1–1000；按手机号与每日上限见 [identity]）
sms_send_per_min = 5
# 刷新令牌接口每个 IP 每分钟次数（次/分钟，1–1000）
refresh_per_min = 30
# 每个会员每分钟领奖次数（次/分钟，1–1000）
lottery_claim_per_min = 5

[breaker]
# 熔断统计窗口（秒，5–3600）；熔断器创建时读取（重启生效）
window_s = 60
# 窗口内至少多少次失败才考虑熔断（次，1–10000，重启生效）
min_failures = 10
# 窗口内失败率达到多少熔断（比例，大于 0 且不超过 1，重启生效）
fail_rate = 0.5
# 熔断打开多久后放探测请求（秒，1–3600，重启生效）
open_s = 30

[auth]
# 资金与敏感操作要求最近认证的时间窗（秒，60–3600）
fresh_window_s = 900
# 服务间签名允许的时钟偏差（秒，30–900）
service_signature_skew_s = 300

[upload]
# 文档类文件上传上限（MB，1–100）；下发客户端用于显示与预检查，服务端按同一个值拒收；照片不设上限、后台压缩
doc_max_mb = 5

[client]
# 客户端回到前台后重新拉取配置的最短间隔（秒，60–86400；下发客户端）
config_refresh_s = 300
# 小程序最低可用版本（x.y.z；下发小程序）；低于它提示重启更新，必须修复的问题同时在微信后台设最低版本
min_version_miniprogram = "0.0.0"
# App 最低可用版本（x.y.z；下发 App）；低于它引导去应用商店更新
min_version_app = "0.0.0"

[features]
# 维护模式（true | false；下发客户端）：开启后顾客端写接口返回 5030，客户端显示维护页；先按门店或渠道灰度
maintenance_mode = false

[membership]
# 订单完成后每 1 元返多少积分（积分/元，0–100，再乘等级倍率）；商户要在后台自己改时改由会员模块的后台设置提供
points_per_yuan = 1
# 积分入账批次有效期（天，0–3650；0 = 不过期）
points_valid_days = 365

# ---------------------------------------------------------------- 01-identity 会员账号：令牌、短信验证码、内容安全、注销与保留
[identity]
# 会员 access 令牌有效期（秒）；新签发的令牌按新值。范围 60–86400；高风险
access_ttl_seconds = 7200
# 校验令牌时允许的时钟偏差（秒，RFC 7519：最多几分钟）。范围 0–300；高风险
jwt_leeway_seconds = 30
# 刷新令牌空闲超时（天），不大于绝对期限。范围 1–30；高风险
refresh_idle_days = 14
# 刷新令牌绝对期限（天，NIST AAL1 不超过 30）。范围 1–30；高风险
refresh_absolute_days = 30
# 刷新令牌轮换后旧令牌的宽限（秒），并发刷新不误判为重放。范围 0–60
refresh_reuse_grace_seconds = 10
# 每个请求校验服务端会话（登出、停用、注销即时生效）。范围 true | false；高风险
session_check = true
# 短信验证码登录与绑定开关；关闭后客户端隐藏短信入口。范围 true | false；下发客户端
sms_enabled = true
# 短信验证码有效期（秒，不超过 10 分钟）。范围 60–600
sms_ttl_seconds = 300
# 同一验证码最多校验几次。范围 1–10
sms_max_attempts = 5
# 同一手机号重发间隔（秒）；客户端倒计时用同一个值。范围 10–600；下发客户端
sms_resend_seconds = 60
# 每个手机号每天最多发几条验证码。范围 1–100；高风险
sms_daily_per_phone = 10
# 每个 IP 每小时最多发几条验证码。范围 1–10000；高风险
sms_hourly_per_ip = 20
# 每个 IP 每天最多发几条验证码。范围 1–100000；高风险
sms_daily_per_ip = 50
# 昵称与头像走内容安全检测。范围 true | false
content_check = true
# 检测服务不可用时是否放行（默认不放行）。范围 true | false；高风险
content_check_fail_open = false
# 头像异步检测多久没有结果按失败处理（分钟）。范围 5–1440
media_check_timeout_minutes = 60
# 注销冷静期（天，个人信息须在 15 个工作日内删除）。范围 0–15；高风险
deletion_cooling_days = 15
# 短信验证码记录保留（天）。范围 1–365
sms_retention_days = 7
# 已失效会话保留（天）。范围 30–3650
session_retention_days = 180

# ---------------------------------------------------------------- 08-order 订单：支付时限、报价、件数上限、条款、任务批量、开关
[order]
# 待支付自动关闭时间（分钟；微信 time_expire 至少 1 分钟）。范围 1–1440；高风险
pay_timeout_minutes = 15
# 报价有效期（秒）。范围 30–3600
quote_ttl_seconds = 600
# 履约后自动完成（天）。范围 1–30
auto_complete_days = 7
# 一单最多几种商品。范围 1–200；下发客户端
max_lines = 50
# 每种商品最多买几件。范围 1–9999；下发客户端
max_qty_per_line = 99
# 下单必须同意购买条款。范围 true | false；高风险
terms_required = true
# 当前购买条款版本（与 27-legal 发布的版本一致）。范围 文本；高风险
terms_version = "purchase-v1"
# 超时关单任务每批几单。范围 1–10000
close_batch = 100
# 自动完成任务每批几单。范围 1–10000
complete_batch = 200
# 允许用储值余额支付订单。范围 true | false；下发客户端
balance_payment_enabled = true
# 发货后向微信上传发货信息。范围 true | false
shipping_upload_enabled = true

# ---------------------------------------------------------------- 09-wechat-pay 微信支付：超时与重试、查单节奏、退款、账单、发货信息（商户号、密钥、回调地址在环境变量）
[wechat_pay]
# 下单接口超时（秒，不重试）。范围 1–30；高风险
timeout_prepay_s = 8.0
# 查单与查退款超时（秒）。范围 1–30
timeout_query_s = 5.0
# 关单超时（秒）。范围 1–30
timeout_close_s = 5.0
# 退款申请超时（秒，不重试，由任务重试）。范围 1–60
timeout_refund_s = 10.0
# 下载账单超时（秒）；HTTP 客户端创建时读取。范围 5–300；重启生效
timeout_bill_s = 30.0
# 查单最多尝试几次。范围 1–10
query_attempts = 3
# 关单最多尝试几次。范围 1–10
close_attempts = 2
# 同时调用微信支付的并发上限（个）；首次调用时创建。范围 1–1000；重启生效
bulkhead = 30
# 应答与回调签名的时间偏差上限（秒）；客户端创建时读取。范围 60–900；重启生效；高风险
timestamp_skew_s = 300
# 支付单默认有效期（分钟），业务没给截止时间时用。范围 1–1440；高风险
default_expire_minutes = 15
# prepay_id 复用期（秒，官方 2 小时有效，留 5 分钟余量）。范围 0–7200
prepay_reuse_seconds = 6900
# 客户端轮询支付结果时同一单主动查单的最短间隔（秒）。范围 1–60
app_sync_min_interval_s = 3
# 下单后主动查单的时间点（秒，官方方案一）。范围 正整数列表
query_schedule_s = [5, 30, 60, 180, 300, 600, 1800]
# 业务已关闭仍到账的支付自动退款。范围 true | false；高风险
auto_refund_orphans = true
# 一笔支付最多部分退款几次（官方上限 50）。范围 1–50
refund_max_times = 50
# 同一笔支付两次退款申请的最短间隔（秒，官方要求 1 分钟；0 = 不限）。范围 0–3600
refund_min_interval_s = 60
# 支付后多少天内可以原路退款（天，官方 1 年）。范围 1–365；高风险
refund_window_days = 365
# 退款申请最多尝试几次，之后转人工。范围 1–20
refund_submit_max_attempts = 5
# 退款申请后快速查询的间隔（秒）。范围 10–600
refund_query_fast_s = 60
# 快速查询持续多久（秒），之后按退避间隔。范围 60–3600
refund_query_fast_window_s = 300
# 退款结果查询的退避间隔（分钟）。范围 正整数列表
refund_query_backoff_min = [5, 10, 20, 30]
# 每天几点后下载前一天的账单（时，0–23，北京时间）。范围 0–23
bill_ready_hour = 10
# 账单未就绪时多久后重试（分钟）。范围 5–720
bill_retry_minutes = 30
# 最多下载多少天前的账单（天，官方 3 个月）。范围 1–90
bill_max_days = 90
# 小程序发货信息管理（上传发货信息）开关。范围 true | false
shipping_enabled = true
# 发货信息上传最多尝试几次。范围 1–50
shipping_max_attempts = 8

# ---------------------------------------------------------------- 10-after-sales 售后：七日无理由、申请窗口、自动同意、寄回期限
[after_sales]
# 七日无理由退货期（天，不少于 7：网络购买商品七日无理由退货暂行办法第十条）。范围 7–30；高风险
no_reason_days = 7
# 质量等其他原因的申请窗口（天）。范围 1–365
window_days = 15
# 商家多少天未处理自动同意（天，0 = 关闭）。范围 0–30；高风险
auto_approve_days = 0
# 同意退货后买家寄回的期限（天）。范围 1–30
return_ship_days = 7
# 申请最多上传几张凭证图。范围 0–20；下发客户端
max_evidence = 9
# 退款失败后多久重试（秒）。范围 10–3600
refund_retry_seconds = 60
# 售后定时任务每批几条。范围 1–10000
job_batch = 200

# ---------------------------------------------------------------- 预付卡（15-recharge 储值与 29-member-card 会员卡共用）
[prepaid]
# 预付卡监管口径预设（单次、累计上限与冷静期等）；连锁跨城市可按门店另行注入。范围 conservative | shanghai_fitness_2025 | shanghai_fitness_draft_2026 | beijing_2022 | national_single_use_card | unlimited；高风险
policy = "conservative"
# 合同成立时一年期 LPR（万分比），退款补偿利息按它计算；按公布值更新。范围 0–2000；高风险
lpr_1y_bp = 300
# 停止收取预付款（经营风险时）：储值与会员卡都停售，客户端隐藏入口。范围 true | false；下发客户端；高风险
stop_prepaid = false

# ---------------------------------------------------------------- 15-recharge 储值
[wallet]
# 充值待支付自动关闭（分钟）。范围 1–1440
pay_timeout_minutes = 15
# 储值退款需要后台审批。范围 true | false；高风险
refund_requires_approval = true
# 后台单次手工调整余额上限（分）。范围 0–10000000；高风险
adjust_max_cents = 50_000
# 允许顾客输入自定义充值金额。范围 true | false；下发客户端
custom_amount_enabled = false
# 自定义充值最低金额（分）。范围 1–10000000；下发客户端
custom_amount_min_cents = 100
# 支付后多少天内可以原路退回（天）。范围 1–365；高风险
original_refund_max_days = 365

# ---------------------------------------------------------------- 29-member-card 会员卡
[member_card]
# 购卡待支付自动关闭（分钟）。范围 1–1440
pay_timeout_minutes = 15
# 顾客可在小程序自助停卡。范围 true | false；下发客户端
app_freeze_enabled = true
# 顾客可在小程序自助转让。范围 true | false；下发客户端
app_transfer_enabled = true
# 会员卡退款需要后台审批。范围 true | false；高风险
refund_requires_approval = true
# 到期前几天提醒（天，可多个）。范围 正整数列表
reminder_days = [7, 3, 1]
# 支付后多少天内可以原路退回（天）。范围 1–365；高风险
original_refund_max_days = 365
# 后台单次手工调整次数上限（次）。范围 1–10000；高风险
adjust_max_sessions = 50
# 后台单次手工调整有效期上限（天）。范围 1–3650；高风险
adjust_max_days = 366

# ---------------------------------------------------------------- 16-coupon 优惠券
[coupon]
# 兑换码长度（位）。范围 8–32
code_length = 12
# 兑换码在窗口内输错几次后锁定。范围 1–100；高风险
code_max_failures = 5
# 兑换码输错计数窗口（秒）。范围 60–86400
code_window_seconds = 600
# 一批最多生成多少个兑换码。范围 1–100000
code_batch_max = 10_000
# 一次批量发券最多多少人。范围 1–100000
issue_batch_max = 10_000
# 过期任务每批几张。范围 1–10000
expire_batch_size = 500
# 到期前多少小时提醒（小时）。范围 1–720
remind_before_hours = 48
# 批量发券任务每批几人。范围 1–10000
issue_job_batch = 200
# 一单最多叠加几张券。范围 1–10；下发客户端
max_coupons_per_order = 3

# ---------------------------------------------------------------- 18-lottery 抽奖（法定上限只能更严：奖品不超过 5 万元、公示门槛不超过 500 元、资料保存不少于 2 年）
[lottery]
# 单个奖品价值上限（分，法定不超过 5 万元）。范围 大于 0、不超过 5000000；高风险
prize_value_cap_cents = 5_000_000
# 奖品价值超过多少须公示兑奖情况（分，法定不超过 500 元）。范围 大于 0、不超过 50000；高风险
publicity_threshold_cents = 50_000
# 抽奖资料保存（天，法定不少于 2 年）。范围 730–3650；高风险
retention_days = 730
# 每个会员每分钟最多抽几次（次/分钟，0 = 不限）；网关与服务内共用。范围 0–1000；高风险
member_draws_per_minute = 10
# 每个 IP 每分钟最多抽几次（次/分钟，0 = 不限）。范围 0–10000；高风险
ip_draws_per_minute = 60
# 发奖事件发出后多久没有回执就重发（秒）。范围 60–86400
delivery_ack_timeout_seconds = 600
# 发奖最多尝试几次，之后等待人工重试。范围 1–20
delivery_max_attempts = 5
# 发奖重试的退避间隔（秒）。范围 正整数列表
delivery_backoff_seconds = [600, 1800, 7200, 21_600, 43_200]
# 实物奖填写收货信息的期限（天）。范围 1–90
default_claim_days = 7
# 一个活动最多几个奖项。范围 1–50
max_prizes = 12
# 后台单次发放抽奖次数上限（次）。范围 1–10000；高风险
max_admin_grant = 100
# 概率模拟最多抽几次。范围 1–10000000
max_simulate = 1_000_000
# 到期清理任务每批几条。范围 1–10000
purge_batch = 500

# ---------------------------------------------------------------- 20-notification 通知：静默时段、重试、订阅额度、短信频控、保留
[notification]
# 静默时段开始（时:分，门店时区）；非紧急消息延后到结束。范围 时:分
quiet_start = "22:00"
# 静默时段结束（时:分，门店时区）。范围 时:分
quiet_end = "08:00"
# 启用静默时段。范围 true | false
quiet_enabled = true
# 投递失败的重试间隔（秒）。范围 正整数列表
retry_backoff_seconds = [60, 300, 1800, 7200]
# 每条消息最多投递几次。范围 1–20
max_attempts = 5
# 单次发送超时（秒）。范围 0.5–30
send_timeout_seconds = 3.0
# 发送中超过多久视为卡住并重新投递（秒）。范围 30–3600
sending_stuck_seconds = 300
# 投递任务每批几条。范围 1–1000
batch_size = 100
# 订阅消息跳转的小程序版本。范围 developer | trial | formal
miniprogram_state = "formal"
# 订阅消息语言。范围 zh_CN | en_US | zh_HK | zh_TW
lang = "zh_CN"
# 订阅额度按什么计数：frontend 前端上报的授权结果、push 微信推送的授权事件（只能选一个，否则额度翻倍）。范围 frontend | push；高风险
quota_source = "frontend"
# 每个模板本地累计额度上限（次）。范围 1–1000
quota_cap_per_template = 50
# 微信返回 43101（用户没有额度）时：reset 清零本地额度、keep 只退回本次占用。范围 reset | keep
on_43101 = "reset"
# 订阅消息每天下发总量（条，官方：开通支付 3000 万、未开通 1000 万）。范围 1–30000000
subscribe_daily_cap = 10_000_000
# 同一手机号每分钟最多几条短信。范围 1–60；高风险
sms_per_minute = 1
# 同一手机号每小时最多几条短信。范围 1–1000；高风险
sms_per_hour = 5
# 同一手机号每天最多几条短信。范围 1–10000；高风险
sms_per_day = 10
# 全店每天短信预算（条）。范围 1–10000000；高风险
sms_daily_cap = 100_000
# 每个会员每天最多收几条非紧急通知（订阅消息与短信合计）。范围 0–100
member_nonurgent_per_day = 5
# 站内信保留（天）。范围 1–3650
inbox_retention_days = 180
# 投递记录保留（天）。范围 1–3650
delivery_retention_days = 180

# ---------------------------------------------------------------- 22-admin-rbac 后台账号：会话、登录锁定、口令、第二因素、保留与导出
[admin_rbac]
# 后台会话空闲超时（秒，OWASP 15–30 分钟）。范围 60–86400；高风险
session_idle_seconds = 900
# 后台会话绝对期限（秒，OWASP 4–8 小时）。范围 300–604800；高风险
session_absolute_seconds = 28_800
# 会话活跃时间最多多久写一次库（秒）。范围 1–3600
session_touch_seconds = 60
# 会话绑定浏览器标识，换了即失效。范围 true | false；高风险
session_bind_user_agent = true
# 每个员工最多同时几个会话。范围 1–50
max_sessions_per_staff = 5
# 资金与敏感操作要求最近认证的时间窗（秒）。范围 60–3600；高风险
fresh_auth_seconds = 300
# 口令通过后完成第二因素的期限（秒）。范围 60–1800
mfa_challenge_seconds = 300
# 窗口内连续登录失败几次锁定账号（NIST 上限 100）。范围 1–100；高风险
login_max_failures = 5
# 登录失败计数窗口（秒）。范围 60–86400
login_failure_window_seconds = 900
# 首次锁定时长（秒），再次锁定逐次加倍到上限。范围 1–86400；高风险
login_lock_seconds = 900
# 锁定时长上限（秒），也是锁定级别的衰减时间。范围 60–604800
login_lock_max_seconds = 86_400
# 连续失败几次后要求人机验证（0 = 不要求）。范围 0–100
captcha_after_failures = 3
# 已绑定第二因素时口令最短长度（位，NIST 不少于 8）。范围 8–64；高风险
password_min_length_mfa = 8
# 只用口令时最短长度（位，NIST 不少于 15）。范围 8–128；高风险
password_min_length_no_mfa = 15
# 口令最长长度（位，至少允许 64）。范围 64–1024
password_max_length = 128
# 额外禁用的口令（如店名、品牌名）。范围 文本列表
password_blocklist_extra = []
# 泄露口令检查服务不可用时拒绝设置口令。范围 true | false；高风险
password_breach_fail_closed = false
# Argon2id 内存参数（KiB，OWASP 最低 19 MiB）。范围 7168–1048576
argon2_memory_kib = 19_456
# Argon2id 迭代次数。范围 1–10
argon2_time_cost = 2
# Argon2id 并行度。范围 1–16
argon2_parallelism = 1
# 临时口令有效期（秒）。范围 3600–604800；高风险
temp_password_ttl_seconds = 259_200
# TOTP 前后各允许几个 30 秒步长的漂移。范围 0–2；高风险
totp_drift_steps = 1
# 每次生成几个恢复码。范围 5–20
recovery_code_count = 10
# 全部员工必须绑定第二因素。范围 true | false；高风险
mfa_required_all = false
# 持有这些权限码（含 module:* 覆盖）的员工必须绑定第二因素。范围 文本列表；高风险
mfa_required_permissions = ["staff:write", "role:write", "after_sale:approve", "after_sale:refund", "payment:refund", "report:export", "wallet:adjust", "wallet:refund", "member_card:adjust", "member_card:refund", "member:reveal"]
# 登录日志保留（天，网络安全法不少于 6 个月，6 个月最长 184 天）。范围 184–3650
login_log_retention_days = 186
# 后台单次导出最多多少行。范围 1–1000000
export_max_rows = 50_000

# ---------------------------------------------------------------- 28-wechat-mp 小程序服务端接口：超时、access_token、订阅与小程序码版本、消息推送（AppSecret、推送密钥在环境变量）
[wechat_mp]
# 服务端接口超时（秒，读类接口）；客户端创建时读取。范围 0.5–30；重启生效
timeout_s = 3.0
# 生成小程序码超时（秒）；客户端创建时读取。范围 1–60；重启生效
qrcode_timeout_s = 5.0
# access_token 到期前多久刷新（秒；新旧 token 5 分钟内都可用）；客户端创建时读取。范围 60–1800；重启生效
token_refresh_margin_s = 300
# 两次强制刷新 access_token 的最短间隔（秒，官方至少 30 秒）；客户端创建时读取。范围 30–3600；重启生效
force_refresh_min_interval_s = 30
# 订阅消息默认跳转的小程序版本；客户端创建时读取。范围 developer | trial | formal；重启生效
miniprogram_state = "formal"
# 订阅消息默认语言；客户端创建时读取。范围 zh_CN | en_US | zh_HK | zh_TW；重启生效
lang = "zh_CN"
# 小程序码默认打开的版本；客户端创建时读取。范围 release | trial | develop；重启生效
env_version = "release"
# 消息推送只接受安全模式（AES 加密）。范围 true | false；高风险
push_require_aes = true
# 消息推送时间戳允许的偏差（秒，0 = 不校验）。范围 0–3600
push_max_skew_s = 0
