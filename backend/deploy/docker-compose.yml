# 本地开发环境（不是生产模板；生产见 assets/deploy/docker-compose.prod.yml）。
# 开发构建用 tag 版基础镜像（PYTHON_IMAGE 覆盖 Dockerfile 中的 digest 占位）；生产 CI 构建使用固定 digest。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: luz
      POSTGRES_USER: luz
      POSTGRES_PASSWORD: luz-dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luz"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: luz
      MINIO_ROOT_PASSWORD: luz-dev-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { PYTHON_IMAGE: "python:3.12-slim-bookworm" } }
    # 迁移后同步权限码与内置角色、文案种子（幂等）；首个超级管理员：docker compose run --rm migrate python -m admin_rbac.bootstrap <username>
    command: ["sh", "-c", "alembic upgrade head && python -m admin_rbac.bootstrap --seed && python -m app_settings sync"]
    healthcheck: { disable: true }   # 镜像自带 HEALTHCHECK 探 api 端口，非 api 进程关闭
    env_file: [.env.dev]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { PYTHON_IMAGE: "python:3.12-slim-bookworm" } }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file: [.env.dev]
    # 运行配置整目录挂载：改 ../config/runtime/*.toml 后各进程热加载；Docker Desktop 的挂载不发文件通知，用轮询
    volumes: ["../config/runtime:/srv/backend/config/runtime:ro"]
    environment: { LUZ_CONFIG_WATCH: poll }
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { PYTHON_IMAGE: "python:3.12-slim-bookworm" } }
    command: ["python", "-m", "jobs", "worker"]
    healthcheck: { disable: true }   # 镜像自带 HEALTHCHECK 探 api 端口，非 api 进程关闭
    env_file: [.env.dev]
    volumes: ["../config/runtime:/srv/backend/config/runtime:ro"]
    environment: { LUZ_CONFIG_WATCH: poll }
    depends_on:
      api: { condition: service_healthy }

  scheduler:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { PYTHON_IMAGE: "python:3.12-slim-bookworm" } }
    command: ["python", "-m", "jobs", "scheduler"]
    healthcheck: { disable: true }   # 镜像自带 HEALTHCHECK 探 api 端口，非 api 进程关闭
    env_file: [.env.dev]
    volumes: ["../config/runtime:/srv/backend/config/runtime:ro"]
    environment: { LUZ_CONFIG_WATCH: poll }
    depends_on:
      api: { condition: service_healthy }

  agent:
    build: { context: ../../agent, dockerfile: ../backend/deploy/Dockerfile.agent }
    command: ["uvicorn", "agent_gateway.app:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file: [.env.dev]
    ports: ["8100:8100"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata: {}
  minio: {}
