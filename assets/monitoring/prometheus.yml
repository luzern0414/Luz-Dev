# Luz Prometheus 抓取配置（references/operations.md §4）。由 docker-compose.prod.yml 的 monitoring profile 挂载。
# 修改后热加载：curl -X POST http://127.0.0.1:9090/-/reload
# 校验：docker run --rm -v $PWD:/m --entrypoint promtool prom/prometheus:v3.15.1 check config /m/prometheus.yml
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: prod                 # 预发改为 staging；告警文案用 $externalLabels.env 区分环境
    cluster: luz-app

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---------------------------------------------------------------- 应用：每个 api 副本一个 target（每容器一个进程）
  - job_name: luz-api
    metrics_path: /metrics
    # Docker DNS 返回 api 服务所有副本的 IP，滚动发布时自动增减
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 15s
    # /metrics 只对 data 网段开放，再加 Bearer 令牌（LUZ_METRICS_TOKEN），双重保护
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token

  # ---------------------------------------------------------------- 业务 SQL 指标（发件箱、任务、支付积压）
  - job_name: luz-sql
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["sql-exporter:9399"]

  # ---------------------------------------------------------------- 基础设施
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { host: app-1 }   # 多台主机时逐台列出

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ---------------------------------------------------------------- 外部黑盒探测（从公网侧看：DNS、TLS、证书到期、HTTP 状态）
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://api.example.com/api/v1/app/config   # 公开、无副作用、走完整链路的接口
          - https://admin.example.com/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------------------------------------------------------------- 元监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]
