# Luz 项目 Nginx 模板（references/operations.md §2、OPS-002）。替换 api.example.com / admin.example.com。
# 域名必须已完成 ICP 备案并在小程序后台配置为 request 合法域名（references/compliance.md）。

server {
    listen 80;
    server_name api.example.com admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10m;            # 上传上限；更大的文件直传对象存储
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # 支付回调：不需要用户登录，但必须验签（PAY-005）；保留原始请求体，不做任何改写
    location /api/v1/payments/notify/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;           # 微信要求 5 秒内应答
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; frame-ancestors 'none'" always;

    # 可选：只允许门店与公司网络访问后台
    # allow 203.0.113.0/24;
    # deny all;

    root /usr/share/nginx/admin;
    location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://api:8000; proxy_set_header X-Forwarded-Proto https; }
}
