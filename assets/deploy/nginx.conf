# Luz 项目 Nginx 网关模板（references/operations.md §2、OPS-002、backend/ROUTING.md）。
# 挂载为 /etc/nginx/conf.d/default.conf（本文件处于 http 上下文）。要求 nginx >= 1.27.3（upstream `resolve`），
# 推荐 nginx 1.30 稳定版（docker-compose.prod.yml 已固定）。替换 api.example.com / admin.example.com。
# 域名必须已完成 ICP 备案并在小程序后台配置为 request 合法域名（references/compliance.md）。
#
# 真实客户端 IP 链路（与后端 LUZ_TRUSTED_PROXIES / uvicorn FORWARDED_ALLOW_IPS 一致）：
#   1) nginx 是最外层（默认）：$remote_addr 就是客户端；向上游发送 X-Forwarded-For = $remote_addr（覆盖，不追加），
#      客户端自带的 XFF 被丢弃，后端只信任 nginx 固定地址 172.30.0.10，取到的 IP 不可伪造。
#   2) 前面还有云 SLB/CLB/CDN：取消下方 realip 三行注释，只填 SLB/CDN 回源网段。realip 会把 $remote_addr
#      改成 XFF 中最右侧的不可信地址，限流 key 与日志随之正确；向上游仍然只发一个值，后端配置无需改动。
#      千万不要 set_real_ip_from 0.0.0.0/0，否则任何人都能伪造 IP 绕过限流。
# 上线首周建议打开 limit_req_dry_run on，观察 error.log 中的 "limiting requests" 后再正式限流。

# ---------------------------------------------------------------- 基础
server_tokens off;
charset utf-8;

# set_real_ip_from 100.64.0.0/10;      # 示例：云 SLB 回源网段，按厂商文档填写
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;

# Docker 内置 DNS；valid=10s 让 upstream `resolve` 在滚动发布时 10 秒内看到新/旧容器变化
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# ---------------------------------------------------------------- 日志（JSON，交给 docker 日志驱动，再由采集器集中留存 >= 180 天）
log_format luz_json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"peer_addr":"$realip_remote_addr","xff_in":"$http_x_forwarded_for","host":"$host",'
  '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"req_bytes":$request_length,"rt":$request_time,"urt":"$upstream_response_time",'
  '"ucs":"$upstream_status","upstream":"$upstream_addr","ua":"$http_user_agent",'
  '"referer":"$http_referer","tls":"$ssl_protocol","limit_req":"$limit_req_status"}';
access_log /dev/stdout luz_json;
error_log  /dev/stderr warn;

# ---------------------------------------------------------------- 客户端超时与体积（默认 60/75s 偏大）
client_header_timeout 10s;
client_body_timeout   15s;
send_timeout          15s;
keepalive_timeout     30s;
client_max_body_size  1m;          # 应用层上限 LUZ_MAX_BODY_BYTES=256KB；上传走对象存储预签名直传
client_body_buffer_size 64k;

# ---------------------------------------------------------------- 压缩
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

# ---------------------------------------------------------------- 限流（每 IP；10m zone 约 8 万个 IP）
# 压测机 / 门店固定出口等可加入白名单：key 为空字符串的请求不计入限流
geo $luz_ratelimit_exempt {
    default 0;
    # 203.0.113.10 1;              # 示例：预发压测机
}
map $luz_ratelimit_exempt $luz_limit_key {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone  $luz_limit_key zone=api_ip:10m   rate=10r/s;   # 通用接口
limit_req_zone  $luz_limit_key zone=login_ip:10m rate=10r/m;   # 登录（应用层另有账号锁定）
limit_req_zone  $luz_limit_key zone=sms_ip:10m   rate=1r/m;    # 短信验证码（应用层另有手机号维度）
limit_conn_zone $luz_limit_key zone=perip:10m;
limit_conn_zone $server_name   zone=perserver:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
# limit_req_dry_run on;            # 观察期：只记录不拒绝

# ---------------------------------------------------------------- TLS（Mozilla intermediate 5.7，http 级对所有 server 生效）
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
# DHE 套件需要 DH 参数：curl -fsSL https://ssl-config.mozilla.org/ffdhe2048.txt -o /etc/luz/certs/ffdhe2048.pem
ssl_dhparam /etc/nginx/certs/ffdhe2048.pem;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;
# OCSP stapling：证书不含 OCSP URL（Let's Encrypt 2025 起已停用 OCSP）时 nginx 仅警告，可改为 off
ssl_stapling on;
ssl_stapling_verify on;

# ---------------------------------------------------------------- 上游
upstream luz_api {
    zone luz_api 64k;
    # resolve：跟随 Docker DNS 变化，滚动发布时新副本自动加入、旧副本自动移出（release.sh）
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;                  # 每个 worker 缓存的空闲长连接数
    keepalive_timeout 60s;         # 必须小于 uvicorn --timeout-keep-alive 75，避免上游先关连接导致 502
    keepalive_requests 1000;
}

# ---------------------------------------------------------------- 统一代理参数（location 内不要再写 proxy_set_header，否则会整体覆盖这里的设置）
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;   # 覆盖而不是追加；后端取最右侧不可信地址
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;    # 覆盖客户端自带值，日志与后端 request_id 对齐
proxy_connect_timeout 3s;
proxy_send_timeout    10s;
proxy_read_timeout    30s;
proxy_next_upstream error timeout http_502 http_503;   # 已发出的 POST/PATCH 默认不会重试（non_idempotent 未开启）
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;
proxy_buffering on;
proxy_request_buffering on;
# 安全响应头统一由 nginx 输出，隐藏应用同名头避免重复
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# ================================================================ 未知 Host：直接断开（防扫描、防 Host 头攻击）
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;       # 不出示任何证书
    access_log /dev/stdout luz_json;
    return 444;
}

# ================================================================ 容器内健康检查与状态（只监听回环，不对外）
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health { default_type text/plain; return 200 "ok\n"; }
    location = /stub_status  { stub_status; }      # 需要时可接 nginx-prometheus-exporter
    location / { return 404; }
}

# ================================================================ HTTP → HTTPS（保留 ACME http-01 校验路径）
server {
    listen 80;
    server_name api.example.com admin.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# ================================================================ 用户端 API：api.example.com
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;   # 2 年；确认所有子域都 HTTPS 后再加 includeSubDomains
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    limit_conn perip 20;
    limit_conn perserver 1000;

    # 运维端点不对公网开放：Prometheus 走 data 网络直连 api:8000/metrics，健康检查走容器内
    location ~ ^/(metrics|readyz|healthz|docs|redoc|openapi\.json)$ { return 404; }

    # 管理接口只走 admin 域名（可限制来源 IP）
    location ^~ /api/v1/admin/ { return 404; }

    # 登录：10 次/分钟/IP，突发 5
    location = /api/v1/app/auth/login {
        limit_req zone=login_ip burst=5 nodelay;
        proxy_pass http://luz_api;
    }

    # 短信验证码：1 次/分钟/IP，突发 2
    location = /api/v1/app/auth/sms/send {
        limit_req zone=sms_ip burst=2 nodelay;
        proxy_pass http://luz_api;
    }

    # 支付与渠道回调：不做 IP 限流（避免误杀微信重试），只靠验签；保留原始请求体；微信要求 5 秒内应答
    # 如渠道公布了固定回调网段，可在此加 allow/deny；否则只靠验签（PAY-005）
    location ^~ /api/v1/payments/notify/ {
        limit_conn perip 100;
        client_max_body_size 64k;
        proxy_read_timeout 5s;
        proxy_next_upstream error;          # 仅连接失败（请求尚未发出）时换实例
        proxy_pass http://luz_api;
    }
    location ^~ /api/v1/webhooks/ {
        limit_conn perip 100;
        client_max_body_size 256k;
        proxy_read_timeout 5s;
        proxy_next_upstream error;
        proxy_pass http://luz_api;
    }

    # 小程序 / App 用户端接口
    location ^~ /api/v1/app/ {
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://luz_api;
    }

    # 员工端、骑手端、智能体等其他 v1 前缀
    location ^~ /api/v1/ {
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://luz_api;
    }

    # 未列出的路径一律 404，不做默认转发（ROUTING.md §2）
    location / { return 404; }
}

# ================================================================ 管理后台：admin.example.com（静态资源 + /api/v1/admin/）
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 可选：只允许门店与公司网络访问后台（推荐）
    # allow 203.0.113.0/24;
    # deny all;

    limit_conn perip 20;
    limit_conn perserver 1000;

    location ~ ^/(metrics|readyz|healthz|docs|redoc|openapi\.json)$ { return 404; }

    location = /api/v1/admin/auth/login {
        limit_req zone=login_ip burst=5 nodelay;
        proxy_pass http://luz_api;
    }

    # 报表与导出：允许较长处理时间（建议改为异步任务 + 下载链接）
    # 用前缀而非正则：下方 ^~ /api/v1/admin/ 命中后不再检查正则 location
    location ^~ /api/v1/admin/reports/ {
        limit_req zone=api_ip burst=5 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://luz_api;
    }
    location ^~ /api/v1/admin/exports/ {
        limit_req zone=api_ip burst=5 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://luz_api;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://luz_api;
    }

    location ^~ /api/ { return 404; }

    # 前端静态资源：带 hash 的文件长缓存，index.html 不缓存
    root /usr/share/nginx/admin;
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000" always;   # location 内 add_header 会覆盖继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
